# Shared config — included by both bibahohub.com and bibahohub.ie server blocks.
# Install to: /etc/nginx/snippets/bibahohub-common.conf

# Security headers
add_header X-Frame-Options           "SAMEORIGIN"   always;
add_header X-Content-Type-Options    "nosniff"      always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Gzip compression
gzip            on;
gzip_types      text/plain text/css application/json application/javascript
                text/xml application/xml image/svg+xml;
gzip_min_length 256;

# Static assets — served directly by nginx (no Node.js hit)
location /_next/static/ {
    alias /var/www/bibahohub_website/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /public/ {
    alias /var/www/bibahohub_website/public/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# Proxy everything else to the Next.js standalone server (PM2)
location / {
    proxy_pass         http://127.0.0.1:4050;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    proxy_connect_timeout 10s;

    proxy_buffering   on;
    proxy_buffer_size 16k;
    proxy_buffers     4 32k;
}

# Block hidden files
location ~ /\. {
    deny all;
}
