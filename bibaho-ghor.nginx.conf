# ─── HTTP → HTTPS redirect (both domains) ─────────────────────────────────────
server {
    listen 80;
    server_name bibahohub.com www.bibahohub.com bibahohub.ie www.bibahohub.ie;
    return 301 https://$host$request_uri;
}

# ─── bibahohub.com ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bibahohub.com www.bibahohub.com;

    ssl_certificate     /etc/letsencrypt/live/bibahohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bibahohub.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/bibahohub-common.conf;
}

# ─── bibahohub.ie ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name bibahohub.ie www.bibahohub.ie;

    ssl_certificate     /etc/letsencrypt/live/bibahohub.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bibahohub.ie/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/bibahohub-common.conf;
}
